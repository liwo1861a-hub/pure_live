name: PureLive Android Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Fixed Signing Key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          
          # 永久固化Release签名证书（基准指纹 351d91c7dfcd180313f0fd42b781a81b846ae6f6bc074a84d7384623bccadee5）
          echo "" | base64 -d > android/app/purelive-release.jks

          echo "storeFile=purelive-release.jks" > android/key.properties
          echo "storePassword=purelive123" >> android/key.properties
          echo "keyPassword=purelive123" >> android/key.properties
          echo "keyAlias=purelive" >> android/key.properties

      - name: Resolve packages
        run: flutter pub get

      - name: Build Android release APK (Split ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi

      - name: Strict 1:1 Signature Verification Gatekeeper
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_CLEAN="351d91c7dfcd180313f0fd42b781a81b846ae6f6bc074a84d7384623bccadee5"
          APK_FILE="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          
          echo "========================================================"
          echo "Verifying APK release signature for: $APK_FILE"
          echo "========================================================"
          
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Using apksigner: $APKSIGNER"
            CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_FILE" 2>&1 || true)
          else
            echo "Using keytool fallback"
            CERT_OUTPUT=$(keytool -printcert -jarfile "$APK_FILE" 2>&1 || true)
          fi
          echo "$CERT_OUTPUT"
          
          ACTUAL_SHA256=$(echo "$CERT_OUTPUT" | grep -i "SHA-256 digest:" | head -n1 | sed -e 's/.*SHA-256 digest: *//' -e 's/ *//g' -e 's/://g' | tr '[:upper:]' '[:lower:]')
          if [ -z "$ACTUAL_SHA256" ]; then
            ACTUAL_SHA256=$(echo "$CERT_OUTPUT" | grep -i "SHA256:" | head -n1 | sed -e 's/.*SHA256: *//' -e 's/ *//g' -e 's/://g' | tr '[:upper:]' '[:lower:]')
          fi
          echo "Extracted SHA256 (clean): $ACTUAL_SHA256"
          echo "Expected SHA256 (clean):  $EXPECTED_CLEAN"
          
          if [ "$ACTUAL_SHA256" != "$EXPECTED_CLEAN" ]; then
            echo "FATAL: APK release signature fingerprint mismatch! Build aborted to protect user in-place upgrade."
            echo "Expected: $EXPECTED_CLEAN"
            echo "Actual:   $ACTUAL_SHA256"
            exit 1
          fi
          echo "SUCCESS: 1:1 Fixed Signature Gatekeeper passed with 100% precision!"

      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION=$(grep '^version:' pubspec.yaml | head -n1 | sed -e 's/version: //' -e 's/+.*//' -e 's/["'\'']//g')
          echo "version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${FULL_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APK_DIR="build/app/outputs/flutter-apk"
          mkdir -p dist_android
          cp "$APK_DIR/app-arm64-v8a-release.apk" "dist_android/PureLive-${VERSION}-android-arm64-v8a.apk" || true
          cp "$APK_DIR/app-armeabi-v7a-release.apk" "dist_android/PureLive-${VERSION}-android-armeabi-v7a.apk" || true
          cp "$APK_DIR/app-x86_64-release.apk" "dist_android/PureLive-${VERSION}-android-x86_64.apk" || true
          ls -lh dist_android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Android-APKs
          path: dist_android/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "PureLive v${{ steps.version.outputs.version }}"
          body: |
            ## PureLive v${{ steps.version.outputs.version }}
            - 自动构建发布 Android 版本
            - 🔒 严格强制固化 Release 签名门禁 (SHA256: 351d91c7dfcd180313f0fd42b781a81b846ae6f6bc074a84d7384623bccadee5)
            - 保证全生命周期无缝覆盖升级安装，彻底杜绝签名不一致
            - 包含 arm64-v8a / armeabi-v7a / x86_64 三大架构分包
          files: |
            dist_android/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

